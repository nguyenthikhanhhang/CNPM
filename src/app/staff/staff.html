<div class="staff-container">
  <h2>👨‍💼 BÀN CÔNG TÁC NHÂN VIÊN CSKH & BÁN HÀNG</h2>
  
  <div class="order-management">
    <h3>Danh Sách Đơn Hàng Cần Xử Lý</h3>
    <table class="order-table">
      <thead>
        <tr>
          <th>Mã Đơn</th>
          <th>Khách Hàng</th>
          <th>SĐT</th>
          <th>Tổng Tiền</th>
          <th>Trạng Thái</th>
          <th>Thao Tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td><b>{{ order.id }}</b></td>
          <td>{{ order.customer }}</td>
          <td>{{ order.phone }}</td>
          <td>{{ order.total | number }}đ</td>
          <td>
            <span [class]="'status-badge ' + order.statusCode">{{ order.status }}</span>
          </td>
          <td>
            <button *ngIf="order.statusCode === 'pending'" (click)="updateStatus(order, 'approved', 'Đã xác nhận')">Duyệt Đơn</button>
            <button *ngIf="order.statusCode === 'approved'" (click)="updateStatus(order, 'shipping', 'Đang giao hàng')">Giao Hàng</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
